name: wf-ci-production

on:
  pull_request:
    branches:
      - production
    types:
      - opened
      - synchronize
      - reopened

jobs:
  linting-job:
    name: Lint HTML and CSS (src only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install linting tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML files
        run: npx htmlhint "src/**/*.html" --config .htmlhintrc || echo "No HTML files found"

      - name: Lint CSS files
        run: npx stylelint "src/**/*.css" --allow-empty-input || echo "No CSS files found"

  build-job:
    name: Build website (no optimize)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist" --no-optimize

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-production"
