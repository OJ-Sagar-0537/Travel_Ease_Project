name: wf-ci-production

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Lint HTML and CSS files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4
      - name: Install stylelint and config
        run: |
          npm install -g stylelint stylelint-config-standard
      - name: Lint HTML files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS files
        run: npx stylelint "**/*.css"

  build-job:
    name: Build the project for production using Parcel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4
      - name: Build website with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./"
      - name: Upload build artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-production"
