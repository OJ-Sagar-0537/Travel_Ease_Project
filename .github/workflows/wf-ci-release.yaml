name: wf-ci-release

on:
  pull_request:
    branches:
      - develop
      - release/v1
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Lint HTML and CSS source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4
      - name: Install stylelint and config
        run: npm install -g stylelint stylelint-config-standard
      - name: Lint HTML files in src
        run: npx htmlhint "src/**/*.html"
      - name: Lint CSS files in styles
        run: npx stylelint "styles/**/*.css"

  build-job:
    name: Build and validate the project by using Parcel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4
      - name: Build website with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist"
      - name: Lint built HTML files in dist
        run: npx htmlhint "dist/**/*.html"
      - name: Upload build Artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-release"