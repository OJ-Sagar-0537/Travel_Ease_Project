name: wf-ci-release

on:
  pull_request:
    branches:
      - develop
      - release
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Lint HTML and CSS files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4

      - name: Install Linting Tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML files in src/
        run: npx htmlhint "src/**/*.html" --config .htmlhintrc || echo "No HTML files found"

      - name: Lint CSS files in src/
        run: npx stylelint "src/**/*.css" --allow-empty-input || echo "No CSS files found"

  build-job:
    name: Build the project by using Parcel (no optimize)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4

      - name: Build website with Parcel (no minify)
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist" --no-optimize

      - name: Upload build Artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-release"
