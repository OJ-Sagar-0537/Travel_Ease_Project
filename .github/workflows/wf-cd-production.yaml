name: wf-cd-deploy-production

on:
  push:
    branches:
      - production

jobs:
  build-job:
    name: Build website (no optimize)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist" --no-optimize

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-production"

  deploy-job:
    name: Deploy to GitHub Pages (production-env)
    needs: build-job
    runs-on: ubuntu-latest
    environment:
      name: production-env
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy artifact
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "Build-artifact-production"
          token: ${{ github.token }}
