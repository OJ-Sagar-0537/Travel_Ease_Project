name: wf-cd-release

on: 
  push:
    branches: 
      - develop
      - release

jobs:
  build-job:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4

      - name: Build website with Parcel (no optimize)
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist" --no-optimize

      - name: Upload build Artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-${{ github.ref_name }}"

  deploy-job:
    name: Deploy to GitHub Pages
    needs: build-job
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}-env"
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "Build-artifact-${{ github.ref_name }}"
          token: "${{ github.token }}"
