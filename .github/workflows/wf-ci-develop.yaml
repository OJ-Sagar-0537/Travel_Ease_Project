name: wf-ci-develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        
      - name: Install dependencies
        run: npm install -g stylelint stylelint-config-standard htmlhint
        
      - name: Create HTMLHint config for source files
        run: |
          echo '{
            "tagname-lowercase": true,
            "attr-lowercase": true,
            "attr-value-double-quotes": true,
            "doctype-first": true,
            "id-unique": true,
            "tag-pair": true,
            "spec-char-escape": true,
            "head-script-disabled": true,
            "style-disabled": true,
            "title-require": true
          }' > .htmlhintrc
          
      - name: Lint HTML files (source only)
        run: |
          if [ -d "src" ]; then
            htmlhint "src/**/*.html" || \
            (echo "HTML validation failed. Please check:"; \
             echo "1. All attributes must use double quotes: attr=\"value\""; \
             echo "2. All tags must be properly closed"; \
             echo "3. Document must have complete structure"; \
             exit 1)
          else
            echo "No src directory found, skipping HTML linting"
          fi
          
      - name: Lint CSS files
        run: |
          if [ -d "styles" ]; then
            npx stylelint "styles/**/*.css"
          else
            echo "No styles directory found, skipping CSS linting"
          fi

  build-job:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs: linting-job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        
      - name: Install dependencies
        run: npm install
        
      - name: Build with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./"
        
      - name: Verify build output
        run: |
          echo "✅ Build completed successfully"
          echo "Built files are in ./dist directory"
          ls -la ./dist/
          echo ""
          echo "File sizes:"
          find ./dist -type f -exec ls -lh {} \; | awk '{print $9 " - " $5}' 2>/dev/null || echo "Build artifacts created"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

  deploy-job:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-job
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4