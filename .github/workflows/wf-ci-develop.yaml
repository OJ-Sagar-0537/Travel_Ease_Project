name: wf-ci-develop
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  linting-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Remove dist folder
        run: rm -rf dist/ || true
      - name: Lint HTML Files With HTMLHint (Source Only)
        run: npx htmlhint src/index.html
      - name: Lint CSS Files With Stylelint
        run: npx stylelint "src/**/*.css" --allow-empty-input || echo "No CSS files found"
  build-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Test Building With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"