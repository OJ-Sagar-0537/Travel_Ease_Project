name: wf-ci-develop

on: 
  pull_request:
    branches: 
      - develop
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Lint HTML and CSS files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm install -g stylelint stylelint-config-standard htmlhint
      - name: Lint HTML files
        run: npx htmlhint "src/**/*.html"
      - name: Lint CSS files
        run: npx stylelint "src/**/*.css"

  build-job:
    name: Build website without minification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4
      - name: Build website with Parcel (no minify)
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist" --no-optimize
      - name: Upload build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-develop"
