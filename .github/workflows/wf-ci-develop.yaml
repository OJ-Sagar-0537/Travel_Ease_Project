name: wf-ci-develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Validate Source Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g stylelint stylelint-config-standard htmlhint
      - run: npx htmlhint "src/**/*.html"
      - run: npx stylelint "styles/**/*.css"

  build-job:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: linting-job
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-develop"