name: wf-ci-develop

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Validate Source Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g stylelint stylelint-config-standard htmlhint
      - run: npx htmlhint "src/**/*.html"
      - run: npx stylelint "styles/**/*.css"

  build-job:
    name: Build and Deploy
    needs: linting-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      
      # Build with minimal HTML transformation
      - run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./" --no-optimize
      
      # Skip HTML validation for dist files
      - name: Skip dist validation
        run: echo "Skipping dist HTML validation as it's generated code"
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-develop"