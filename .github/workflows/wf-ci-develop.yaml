name: wf-ci-develop

on: 
  pull_request:
    branches: 
      - develop
    types: [opened, synchronize, reopened]

jobs:
  linting-job:
    name: Lint HTML and CSS files (src only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4

      - name: Install Linting Tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML files in src/
        run: npx htmlhint "src/**/*.html" --config .htmlhintrc || echo "No HTML files found"

      - name: Lint CSS files in src/
        run: npx stylelint "src/**/*.css" --allow-empty-input || echo "No CSS files found"

  build-job:
    name: Build project using Parcel (no minify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to Runner
        uses: actions/checkout@v4

      - name: Build website with Parcel
        run: npx parcel build "./src/*.html" --dist-dir "./dist" --public-url "./dist" --no-optimize

      - name: Upload build Artifacts to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "Build-artifact-develop"
